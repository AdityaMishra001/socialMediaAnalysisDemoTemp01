version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feedbackai-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=sqlite+aiosqlite:///./feedback_ai.db
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend/feedback_ai.db:/app/feedback_ai.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: feedbackai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
